name: Risk

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: write

jobs:
  evaluate:
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'owner-approved' || startsWith(github.event.label.name, 'risk:')
    concurrency:
      group: risk-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Label and set the risk status
        run: |
          label="$(bun .guardrails/risk.js --base "origin/${{ github.event.pull_request.base.ref }}")"
          bun .guardrails/risk-gate.js --label "$label"
