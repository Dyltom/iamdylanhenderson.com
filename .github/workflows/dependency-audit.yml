name: Dependency audit

on:
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: audit
        run: |
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee audit.txt
      - name: Open or update the audit issue
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dependency-audit --color D93F0B --force >/dev/null
          body="$(printf '`bun audit --audit-level=high` found high or critical advisories at %s.\n\n```\n%s\n```\n' "$GITHUB_SHA" "$(tail -c 60000 audit.txt)")"
          existing="$(gh issue list --label dependency-audit --state open --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Dependency audit: high or critical advisories" --label dependency-audit --body "$body"
          fi
